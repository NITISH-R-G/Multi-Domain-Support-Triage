name: Deploy documentation to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create index.html
        run: |
          mkdir -p docs_site
          cp -r docs/* docs_site/ || true
          if [ ! -f docs_site/index.html ]; then
             if [ -f README.md ]; then
                # Extremely simple fallback index
                echo "<html><body><h1>HackerRank Orchestrate Docs</h1><p>See repository <a href='https://github.com/${{ github.repository }}'>README</a></p></body></html>" > docs_site/index.html
             else
                echo "<html><body><h1>Docs</h1></body></html>" > docs_site/index.html
             fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
