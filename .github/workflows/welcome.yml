name: Welcome new contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Welcome to the HackerRank Orchestrate repository! Thank you for opening your first issue. Our AI maintainers and the community will assist you shortly.'
          pr-message: 'Welcome to the HackerRank Orchestrate repository! Thank you for your first pull request. We will review it shortly. Meanwhile, please ensure tests pass.'
