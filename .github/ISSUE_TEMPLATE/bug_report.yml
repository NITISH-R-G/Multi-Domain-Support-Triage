name: Bug report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. iOS, Windows, macOS
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser
      description: e.g. chrome, safari
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: e.g. 22
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Expected priority
      description: A clear and concise description of the priority and impact of the bug.
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs/Traces
      description: If applicable, paste any related logs or stack traces.
      render: shell
    validations:
      required: false