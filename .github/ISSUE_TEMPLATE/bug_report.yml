name: Bug report
description: Create a report to help us improve
title: ''
labels: []
assignees: []
body:
  - type: textarea
    id: bug_description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: desktop
    attributes:
      label: Desktop (please complete the following information)
      description: OS, Browser, Version
  - type: textarea
    id: smartphone
    attributes:
      label: Smartphone (please complete the following information)
      description: Device, OS, Browser, Version
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here, including expected priority or screenshots.
  - type: textarea
    id: logs
    attributes:
      label: Logs/Traces
      description: If applicable, paste any related logs or stack traces.
