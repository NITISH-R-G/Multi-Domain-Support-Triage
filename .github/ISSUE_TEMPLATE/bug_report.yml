name: Bug report
description: Create a report to help us improve
title: ''
labels: []
assignees: []

body:
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: to-reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.

  - type: textarea
    id: desktop-info
    attributes:
      label: Desktop
      description: Please complete the following information if applicable.
      value: |
        - OS: [e.g. iOS]
        - Browser: [e.g. chrome, safari]
        - Version: [e.g. 22]

  - type: textarea
    id: smartphone-info
    attributes:
      label: Smartphone
      description: Please complete the following information if applicable.
      value: |
        - Device: [e.g. iPhone6]
        - OS: [e.g. iOS8.1]
        - Browser: [e.g. stock browser, safari]
        - Version: [e.g. 22]

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.

  - type: textarea
    id: expected-priority
    attributes:
      label: Expected priority
      description: A clear and concise description of the priority and impact of the bug.

  - type: textarea
    id: logs-traces
    attributes:
      label: Logs/Traces
      description: If applicable, paste any related logs or stack traces.
