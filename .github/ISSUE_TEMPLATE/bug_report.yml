name: Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop Environment
      description: OS, Browser, Version (if applicable)
  - type: input
    id: smartphone
    attributes:
      label: Smartphone Environment
      description: Device, OS, Browser, Version (if applicable)
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
  - type: input
    id: priority
    attributes:
      label: Expected priority
      description: A clear and concise description of the priority and impact of the bug.
  - type: textarea
    id: logs
    attributes:
      label: Logs/Traces
      description: Paste any related logs or stack traces.
