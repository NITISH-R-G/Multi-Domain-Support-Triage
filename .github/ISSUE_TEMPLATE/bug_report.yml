name: Bug report
description: Create a report to help us improve
title: ''
labels: []
assignees: []

body:
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.

  - type: textarea
    id: desktop-info
    attributes:
      label: Desktop (please complete the following information)
      description: OS, Browser, Version

  - type: textarea
    id: smartphone-info
    attributes:
      label: Smartphone (please complete the following information)
      description: Device, OS, Browser, Version

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.

  - type: textarea
    id: expected-priority
    attributes:
      label: Expected priority
      description: A clear and concise description of the priority and impact of the bug.

  - type: textarea
    id: logs-traces
    attributes:
      label: Logs/Traces
      description: If applicable, paste any related logs or stack traces.
