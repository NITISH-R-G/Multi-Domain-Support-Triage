name: Bug report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
  - type: input
    id: desktop-os
    attributes:
      label: Desktop OS
      description: e.g. macOS, Windows, Linux
  - type: input
    id: desktop-browser
    attributes:
      label: Desktop Browser
      description: e.g. Chrome, Firefox, Safari
  - type: input
    id: desktop-version
    attributes:
      label: Desktop Browser Version
  - type: input
    id: smartphone-device
    attributes:
      label: Smartphone Device
      description: e.g. iPhone 13, Pixel 6
  - type: input
    id: smartphone-os
    attributes:
      label: Smartphone OS
      description: e.g. iOS 15, Android 12
  - type: input
    id: smartphone-browser
    attributes:
      label: Smartphone Browser
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
  - type: input
    id: expected-priority
    attributes:
      label: Expected priority
      description: A clear and concise description of the priority and impact of the bug.
  - type: textarea
    id: logs-traces
    attributes:
      label: Logs/Traces
      description: If applicable, paste any related logs or stack traces.
