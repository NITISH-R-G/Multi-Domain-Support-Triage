name: Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: bug_description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
  - type: input
    id: desktop_os
    attributes:
      label: Desktop OS
      description: e.g. macOS, Windows, Linux
  - type: input
    id: desktop_browser
    attributes:
      label: Desktop Browser
      description: e.g. chrome, safari
  - type: input
    id: smartphone_device
    attributes:
      label: Smartphone Device
      description: e.g. iPhone6
  - type: input
    id: smartphone_os
    attributes:
      label: Smartphone OS
      description: e.g. iOS8.1
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
  - type: textarea
    id: expected_priority
    attributes:
      label: Expected priority
      description: A clear and concise description of the priority and impact of the bug.
  - type: textarea
    id: logs_traces
    attributes:
      label: Logs/Traces
      description: If applicable, paste any related logs or stack traces.
